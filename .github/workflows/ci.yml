name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev ty check

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/viser4d/client/package-lock.json
      - run: npm ci --prefix src/viser4d/client
      - run: npm --prefix src/viser4d/client run typecheck
      - run: npm --prefix src/viser4d/client run build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/viser4d/client/package-lock.json
      - run: npm ci --prefix src/viser4d/client
      - run: npm --prefix src/viser4d/client run build
      - run: uv build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/viser4d/client/package-lock.json
      - run: npm ci --prefix src/viser4d/client
      - run: npm --prefix src/viser4d/client run build
      - run: uv run --group dev pytest -q

  test-viser-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/viser4d/client/package-lock.json
      - run: npm ci --prefix src/viser4d/client
      - run: npm --prefix src/viser4d/client run build
      - run: uv sync --group dev
      - run: uv pip install --python .venv/bin/python --upgrade viser
      - run: uv run --group dev pytest -q
