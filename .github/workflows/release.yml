name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/viser4d/client/package-lock.json
      - name: Detect release state
        id: version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          git fetch --tags
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_tag=true" >> "$GITHUB_OUTPUT"
          fi

          if uv run python -c "import json, sys, urllib.request; version = sys.argv[1]; releases = json.load(urllib.request.urlopen('https://pypi.org/pypi/viser4d/json'))['releases']; sys.exit(0 if version in releases else 1)" "$version"
          then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push tag
        if: steps.version.outputs.needs_tag == 'true'
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Install runtime build dependencies
        if: steps.version.outputs.needs_tag == 'true' || steps.version.outputs.needs_publish == 'true'
        run: npm ci --prefix src/viser4d/client
      - name: Build runtime bundle
        if: steps.version.outputs.needs_tag == 'true' || steps.version.outputs.needs_publish == 'true'
        run: npm --prefix src/viser4d/client run build
      - name: Build
        if: steps.version.outputs.needs_tag == 'true' || steps.version.outputs.needs_publish == 'true'
        run: uv build
      - name: Publish to PyPI
        if: steps.version.outputs.needs_publish == 'true'
        run: uv publish
      - name: Create GitHub release
        if: steps.version.outputs.needs_tag == 'true' || steps.version.outputs.needs_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --generate-notes
          fi
