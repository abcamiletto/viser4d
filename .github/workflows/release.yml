name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Detect release state
        id: version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          git fetch --tags
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_tag=true" >> "$GITHUB_OUTPUT"
          fi

          if uv run python -c "import json, sys, urllib.request; version = sys.argv[1]; releases = json.load(urllib.request.urlopen('https://pypi.org/pypi/viser4d/json'))['releases']; sys.exit(0 if version in releases else 1)" "$version"
          then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push tag
        if: steps.version.outputs.needs_tag == 'true'
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Install runtime build dependencies
        if: steps.version.outputs.needs_tag == 'true' || steps.version.outputs.needs_publish == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build runtime bundle
        if: steps.version.outputs.needs_tag == 'true' || steps.version.outputs.needs_publish == 'true'
        run: pnpm run build:runtime
      - name: Build
        if: steps.version.outputs.needs_tag == 'true' || steps.version.outputs.needs_publish == 'true'
        run: uv build
      - name: Publish to PyPI
        if: steps.version.outputs.needs_publish == 'true'
        run: uv publish
      - name: Create GitHub release
        if: steps.version.outputs.needs_tag == 'true' || steps.version.outputs.needs_publish == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
