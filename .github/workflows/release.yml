name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Detect release state
        id: version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          git fetch --tags
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_tag=true" >> "$GITHUB_OUTPUT"
          fi

          if python - "$version" <<'PY'
import json
import sys
import urllib.error
import urllib.request

version = sys.argv[1]
try:
    with urllib.request.urlopen("https://pypi.org/pypi/viser4d/json") as response:
        releases = json.load(response)["releases"]
except urllib.error.HTTPError as exc:
    if exc.code == 404:
        sys.exit(1)
    raise

sys.exit(0 if version in releases else 1)
PY
          then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push tag
        if: steps.version.outputs.needs_tag == 'true'
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Build
        if: steps.version.outputs.needs_tag == 'true' || steps.version.outputs.needs_publish == 'true'
        run: uv build
      - name: Publish to PyPI
        if: steps.version.outputs.needs_publish == 'true'
        run: uv publish
      - name: Create GitHub release
        if: steps.version.outputs.needs_tag == 'true' || steps.version.outputs.needs_publish == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
