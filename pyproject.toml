[project]
name = "viser4d"
version = "0.19.0"
description = "A viser extension with out-of-the-box support for the time dimension"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Andrea Boscolo Camiletto", email = "abcamiletto@gmail.com" }]
keywords = ["viser", "visualization", "3d", "timeline", "animation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.11"
dependencies = [
    "msgspec>=0.18",
    "nodeenv>=1.9.1",
    "numpy>=2.4.1",
    "viser>=1.0.30,<1.1",
    "zstandard>=0.23",
]

[project.urls]
Homepage = "https://github.com/abcamiletto/viser4d"
Repository = "https://github.com/abcamiletto/viser4d"
Issues = "https://github.com/abcamiletto/viser4d/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.16,<0.17",
    "ty>=0.0.1a7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.package-data]
viser4d = ["py.typed", "runtime.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
